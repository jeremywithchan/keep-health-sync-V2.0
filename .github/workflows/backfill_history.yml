name: Backfill History V2.0

on:
  workflow_dispatch:

jobs:
  backfill:
    runs-on: ubuntu-24.04
    steps:
      - name: Native Git Checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init
          git remote add origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git
          git fetch --depth 1 origin ${{ github.sha }}
          git checkout FETCH_HEAD

      - name: Install Dependencies & Run Backfill
        env:
          KEEP_PHONE: ${{ secrets.KEEP_PHONE }}
          KEEP_MOBILE: ${{ secrets.KEEP_MOBILE }}
          KEEP_PASSWORD: ${{ secrets.KEEP_PASSWORD }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          pip3 install --break-system-packages requests gspread google-auth pytz
          python3 backfill_keep_history.py
