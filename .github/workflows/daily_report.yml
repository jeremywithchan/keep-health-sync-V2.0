name: Daily Health Report V2.0

on:
  schedule:
    - cron: '0 21 * * *'  # 北京时间 05:00
  workflow_dispatch:

jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - name: Native Git Checkout
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init
          git remote add origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git
          git fetch --depth 1 origin ${{ github.sha }}
          git checkout FETCH_HEAD

      - name: Install Dependencies & Generate Report
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: |
          pip3 install --break-system-packages requests gspread google-auth
          python3 generate_daily_report.py
